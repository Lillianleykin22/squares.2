<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>משחק סיימון</title>
</head>
<body>
<h1>משחק סיימון</h1>
<div id="gamestart"></div>
<div id="score"></div>
<div id="gameover"></div>
<div id = "newgame">התחל מחדש</div>
<div id = "buttonscontainer">
    <div class="redbutton" id="red"></div>
    <div class="greenbutton" id="green"></div>
    <div class="bluebutton" id="blue"></div>
    <div class="yellowbutton" id="yellow"></div>
</div>

<style>
    body {
        text-align: center;
        background-color: #fdf6ec;
        font-family: Arial, sans-serif;
    }

    h1 {
        background-color: antiquewhite;
        font-size: 42px;
        margin: 40px auto 20px auto;
        letter-spacing: 2px;
        padding: 20px;
        width: fit-content;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .redbutton, .greenbutton, .bluebutton, .yellowbutton {
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        transition: transform 0.1s, opacity 0.2s;
    }

    .redbutton:active, .greenbutton:active, .bluebutton:active, .yellowbutton:active {
        transform: scale(0.95);
    }
    #score{
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #222;
        margin-top: 40px;
    }
    #gameover{
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #222;
        margin-top: 40px;
        min-height: 30px;
    }
        #buttonscontainer {
            display: grid;
            grid-template-columns: 150px 150px;
            grid-template-rows: 150px 150px;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        .redbutton{
            background-color: red;
            color: white;
            border: black solid 2px;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            cursor: pointer;
        }

    .greenbutton{
        background-color: green;
        color: white;
        border: black solid 2px;
        border-radius: 50%;
        width: 150px;
        height: 150px;
        cursor: pointer;
    }
    .bluebutton{
        background-color: blue;
        color: white;
        border: black solid 2px;
        border-radius: 50%;
        width: 150px;
        height: 150px;
        cursor: pointer;
    }
    .yellowbutton{
        background-color: yellow;
        color: white;
        border: black solid 2px;
        border-radius: 50%;
        width: 150px;
        height: 150px;
        cursor: pointer;
    }
    .flash {
        opacity: 0.5;
    }
    #newgame {
        display: inline-block;
        background-color: #333;
        color: white;
        font-size: 18px;
        font-weight: bold;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        transition: background-color 0.2s;
    }

    #newgame:hover {
        background-color: #555;
    }
</style>
<script>
    let score = 0;
    const colors = ["red", "green", "blue", "yellow"];
    let gameSequence = [];
    let userClickedPattern = [];
    function getRandomColor() {
        let randomIndex = Math.floor(Math.random() * colors.length);
        return colors[randomIndex];
    }
    function nextSequence() {
        let randomColor = getRandomColor();
        gameSequence.push(randomColor);
        console.log(gameSequence);
    }
    function flashButton(color) {
        let button = document.getElementById(color);
        button.classList.add("flash");
        setTimeout(function() {
            button.classList.remove("flash");
        }, 300);
    }
    function playSequence() {
        gameActive = false;

        for (let i = 0; i < gameSequence.length; i++) {
            setTimeout(function() {
                flashButton(gameSequence[i]);
            }, i * 600);
        }

        setTimeout(function() {
            gameActive = true;
        }, gameSequence.length * 600);
    }
    let currentLevel = 0;
    let gameActive = true;
    let buttons = document.querySelectorAll("#buttonscontainer div");

    buttons.forEach(function(button) {
        button.addEventListener("click", function() {
            if (!gameActive) {
                return;
            }

            let userChosenColor = this.id;
            flashButton(userChosenColor);
            userClickedPattern.push(userChosenColor);

            checkAnswer(currentLevel);

            currentLevel++;
        });
    });

    function checkAnswer(currentLevel) {
        if (userClickedPattern[currentLevel] === gameSequence[currentLevel]) {

            if (userClickedPattern.length === gameSequence.length) {
                score++;
                document.getElementById("score").textContent = "Score: " + score;

                setTimeout(function() {
                    userClickedPattern = [];
                    currentLevel = 0;
                    nextSequence();
                    playSequence();
                }, 1000);
            }

        } else {
            gameActive = false;
            document.getElementById("gameover").textContent = "משחק נגמר! הניקוד הסופי שלך: " + score;

            setTimeout(function() {
                startNewGame();
            }, 1500);
        }
    }
    function startNewGame() {
        score = 0;
        gameSequence = [];
        userClickedPattern = [];
        currentLevel = 0;
        gameActive = true;

        document.getElementById("score").textContent = "";
        document.getElementById("gameover").textContent = "";

        nextSequence();
        playSequence();
    }

    document.getElementById("newgame").addEventListener("click", startNewGame);

    startNewGame();
</script>

</body>
</html>
