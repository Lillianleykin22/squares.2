<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ריבועים מכל מיני צבעים</title>
</head>
<style>
    .main_color
    {
        width: 400px;
        height: 400px;
        border: 1px solid black;
        border-radius: 10px;
        margin: 0 auto;
    }
    .btn
    {
        width: 70px;
        height: 70px;
        border: 1px solid red;
        border-radius: 50%;
        display: inline-block;
        margin: 10px;
    }
    .container
    {
        width: 100%;
        text-align: center;
    }
    .btn{
        width: 70px;
        height: 70px;
        border: 1px solid #027602;
        border-radius: 50%;
        display: inline-block;
        margin: 10px;
    }
</style>
<body>
<script>
    function setBig(color) {
        let screen = document.getElementById("bigScreen")
        screen.style.backgroundColor = color;
    }
    let el = document.createElement("div")
    el.classList.add("main_color");
    el.id = "bigScreen";
    document.body.appendChild(el);

    el = document.createElement("div")
    el.classList.add("container");
    el.id = "container";
    document.body.appendChild(el);

    let count = new Array(4);
    let colors = ["red", "green", "blue", "yellow"];
    for(let clr of colors) {
        //create div
        let btn = document.createElement("div");
        //add class (btn) to div
        btn.classList.add("btn");
        //add style (background-color) to div
        btn.style.backgroundColor = clr;
        //add onclick event listener to div
        btn.addEventListener("click", function () {
            setBig(clr);
        });
        //append div to container
        document.getElementById("container").appendChild(btn);
        let main_color = document.createElement("div");
        main_color.classList.add("main_color");
        main_color.style.backgroundColor = clr;
        main_color.addEventListener("click", function () {
        })
        let container = document.createElement("div");
        container.classList.add("container");
        container.style.backgroundColor = clr;
        container.addEventListener("click", function () {
        })
        count.forEach((element, index) => {})
        let countElement = document.createElement("div");
        countElement.classList.add("count");
        countElement.style.backgroundColor = clr;
        countElement.addEventListener("click", function () {})
    }
</script>
</body>
</html>
