<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ריבועים מכל מיני צבעים</title>
</head>
<style>
    .main_color
    {
        width: 400px;
        height: 400px;
        border: 1px solid red;
        border-radius: 10px;
        margin: 0 auto;
    }
    .btn
    {
        width: 70px;
        height: 70px;
        border: 1px solid red;
        border-radius: 50%;
        display: inline-block;
        margin: 10px;
    }
    .container
    {
        width: 100%;
        text-align: center;
    }
    .btn{
        width: 70px;
        height: 70px;
        border: 1px solid #027602;
        border-radius: 50%;
        display: inline-block;
        margin: 10px;
    }
</style>
<body>
<div class = "main_color" id = "bigScreen"></div>
<div class = "container" id = "container"></div>
<script>
    function setBig(color) {
        let screen = document.getElementById("bigScreen")
        screen.style.backgroundColor = color;
    }
    let colors = ["red", "green", "blue", "yellow"];
    for(let clr of colors){
        //create div
        let btn = document.createElement("div");
        //add class (btn) to div
        btn.classList.add("btn");
        //add style (background-color) to div
        btn.style.backgroundColor = clr;
        //add onclick event listener to div
       btn.addEventListener("click", function(){
           setBig(clr);
       });
        //append div to container
        document.getElementById("container").appendChild(btn);
    }
</script>
</body>
</html>
