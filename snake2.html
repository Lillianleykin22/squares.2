<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>snake</title>
</head>
<style>
    body {
        direction: rtl;
            font-size: 30px;
            background-color: yellow;
        }
    .greenText {
        background-color: lightgreen;
        width: 80%;
        margin-right: 10%;
        margin-top: 30px;
        padding: 10px;
        text-align: center;
    }
    td{
        height: 20px;
        width: 30px;
        border: 1px solid black;
    }
    table{margin: 0 auto;}
    tr:nth-child(even) td:nth-child(even){
        background-color: lightcoral;
    }
    tr:nth-child(odd) td:nth-child(odd) {
        background-color: lightblue;
    }
    tr:hover{
        background-color: lightcoral;}


    .greenbutton {
        background-color: green;
        color: white;
        width: 30%;
        font-size: 24px;
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
       cursor: pointer;
    }


    #gameboard {
        margin: 0 auto;
        width: 600px;
        display: grid;
        grid-template-columns: repeat(20, 30px);
        grid-template-rows: repeat(20, 30px);
        background-color: white;
        border: 1px solid black;
        box-sizing: border-box;

    }

        #gameboard div {
            border: 1px solid black;
        }

        .food {
            background-color: lightgreen;
        }

        .snake {
            background-color: red;
        }

        .snakeHead {
            background-color: #780202;
        }
    #newGameBtn {
        display: none;
    }


</style>
</head>
<body>
<h1 class="greenText">
    משחק סנייק
</h1>
    <button id="newGameBtn">להתחלת משחק חדש</button>
<div id="gameboard"></div>
<script>
    const CellValues ={
        EMPTY:0,
        FOOD:5,
        SNAKE:10,
        SNAKE_HEAD:4,
    }
    let numOfCols = 20;
    let numOfRows = 20;
    let board = [];
    for (let i = 0; i < numOfRows; i++) {

    }
    console.log(board);
    function CreatBoard(){
        for (let i = 0; i < numOfRows; i++) {
            board[i] = [];
            for (let j = 0; j < numOfCols; j++) {
                board[i].push(CellValues.EMPTY);
            }
        }
    }
    function AddFood(){
        let row, col;
        do {
            col = Math.floor(Math.random() * numOfCols);
            row = Math.floor(Math.random() * numOfRows);
        }
        while(board[row][col] !== CellValues.EMPTY)
        board[row][col] = CellValues.FOOD;
    }
    function ShowBoardWithInnerHTML(){
        let brd = document.getElementById("gameboard");
        let str = "";
        str += "<table>";
        for (let r = 0; r < numOfRows; r++) {
            str += "<tr>";
            for (let c = 0; c < numOfCols; c++) {
                if(board [r][c] === CellValues.FOOD) {
                    str += "<td class = 'food'></td>";
                }
                else {
                    str += "<td></td>";
                }
            }
            str += "</tr>";
        }
        str += "</table>";
        brd.innerHTML = str;
    }
    function ShowBoard(){
        let brd = document.getElementById("gameboard");
        let tbl = document.getElementById("table");
        for (let r = 0; r < numOfRows; r++) {
            let tr = document.createElement("tr");
            for (let c = 0; c < numOfCols; c++) {
                let td = document.createElement("td");
                if (board [r][c] === CellValues.SNAKE) {
                    td.classList.add("snake");
                }else if (board [r][c] === CellValues.FOOD) {
                    td.classList.add("food");
                }
                tr.appendChild(td);
            }
            tbl.appendChild(tr);
        }
        brd.appendChild(tbl);
    }
    function ShowBoardWithDiv() {
        let brd = document.getElementById("gameboard");
        brd.innerHTML = "";
        for (let r = 0; r < numOfRows; r++) {
            for (let c = 0; c < numOfCols; c++) {
                let el = document.createElement("div");
                switch(board[r][c]){
                    case CellValues.SNAKE:     el.classList.add("snake");    break;
                    case CellValues.SNAKE_HEAD:el.classList.add("snakeHead");break;
                    case CellValues.FOOD:      el.classList.add("food");     break;
                }
            brd.appendChild(el);
            }
        }
    }
    let snake;
    function InitSnake() {
        board [5][0] = CellValues.SNAKE;
        board [5][1] = CellValues.SNAKE;
        board [5][2] = CellValues.SNAKE_HEAD;
        snake = [
                   {r:5, c:2},
                   {r:5, c:1},
                   {r:5, c:0}
            ];
    }
    function moveLeft(){
        console.log("moveLeft");
        let head =snake[0];
        let newCol = head.c-1;
        let newRow = head.r;
        if (newCol < 0) {
            EndGame("פגעת בקיר!");
            return;
        }
                    snake.unshift({r:newRow, c:newCol});
        let tail = snake.pop();
        board[tail.r] [tail.c] = CellValues.EMPTY;
        board[newRow][newCol] = CellValues.SNAKE_HEAD;
        board[head.r][head.c] = CellValues.SNAKE;
    }
    function moveRight(){
        console.log("moveRight");
        let head =snake[0];
        let newCol = head.c+1;
        let newRow = head.r;
        if (newCol <= numOfCols) {
            EndGame("פגעת בקיר!");
            return;
        }
        snake.unshift({r:newRow, c:newCol});
        let tail = snake.pop();
        board[tail.r] [tail.c] = CellValues.EMPTY;
        console.log("snake'", snake)
        board[newRow][newCol] = CellValues.SNAKE_HEAD;
        board[head.r][head.c] = CellValues.SNAKE;

    }
    function moveUp(){
        console.log("moveUp");
        let head =snake[0];
        let newRow = head.r - 1;
        let newCol = head.c;
        if (newRow < 0) {
            EndGame("פגעת בקיר!");
            return;
        }
        snake.unshift({r:newRow, c:newCol});
        let tail = snake.pop();
        board[tail.r] [tail.c] = CellValues.EMPTY;
        console.log("snake'", snake)
        board[newRow][newCol] = CellValues.SNAKE_HEAD;
        board[head.r][head.c] = CellValues.SNAKE;

    }
    function moveDown(){
        console.log("moveDown");
        let head =snake[0];
        let newRow = head.r + 1;
        let newCol = head.c;
        if (newRow <= numOfRows) {
            EndGame("פגעת בקיר!");
            return;
        }
        snake.unshift({r:newRow, c:newCol});
        let tail = snake.pop();
        board[tail.r] [tail.c] = CellValues.EMPTY;
        console.log("snake'", snake)
        board[newRow][newCol] = CellValues.SNAKE_HEAD;
        board[head.r][head.c] = CellValues.SNAKE;

    }
    function CreateLeftButton(){
        let btn = document.createElement("button");
        btn.textContent = "שמאלה";
        btn.addEventListener("click", function () {
            moveLeft();
            ShowBoardWithDiv();
        });
        document.body.appendChild(btn);
    }
    function CreateRightButton() {
        let btn = document.createElement("button");
        btn.textContent = "ימינה";
        btn.addEventListener("click", function () {
            moveRight();
            ShowBoardWithDiv();
        });
        document.body.appendChild(btn);
    }
    function CreateUpButton() {
        let btn = document.createElement("button");
        btn.textContent = "למעלה";
        btn.addEventListener("click", function () {
            moveUp();
            ShowBoardWithDiv();
        });
        document.body.appendChild(btn);
    }
    function CreateDownButton() {
        let btn = document.createElement("button");
        btn.textContent = "למטה";
        btn.addEventListener("click", function () {
            moveDown();
            ShowBoardWithDiv();
        });
        document.body.appendChild(btn);
    }
    function EndGame(message){
        alert(message);
    }


    CreatBoard();
    InitSnake();
    AddFood();
    ShowBoardWithDiv();
    CreateLeftButton();
    CreateRightButton();
    CreateUpButton();
    CreateDownButton();
        document.getElementById("gamestartMsg").style.display = "none";
        console.log(board);


</script>
</body>
</html>
