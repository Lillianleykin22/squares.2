<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>snake</title>
</head>
<style>
    body {
        direction: ltr;
            font-size: 30px;
            background-color: yellow;
        }
    .greenText {
        background-color: lightgreen;
        width: 80%;
        margin-right: 10%;
        margin-top: 30px;
        padding: 10px;
        text-align: center;
    }
    td{
        height: 20px;
        width: 30px;
        border: 1px solid black;
    }
    table{margin: 0 auto;}
    tr:nth-child(even) td:nth-child(even){
        background-color: lightcoral;
    }
    tr:nth-child(odd) td:nth-child(odd) {
        background-color: lightblue;
    }
    tr:hover{
        background-color: lightcoral;}


    .greenbutton {
        background-color: green;
        color: white;
        width: 30%;
        font-size: 24px;
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
       cursor: pointer;
    }


    #gameboard {
        margin: 0 auto;
        width: 600px;
        display: grid;
        grid-template-columns: repeat(20, 30px);
        grid-template-rows: repeat(20, 30px);
        background-color: white;
        border: 1px solid black;
        box-sizing: border-box;

    }

        #gameboard div {
            border: 1px solid black;
        }

        .food {
            background-color: lightgreen;
        }

        .snake {
            background-color: red;
        }

        .snakeHead {
            background-color: #780202;
        }
    #newGameBtn {
        display: none;
    }
    #controls {
        margin: 20px auto;
        width: 200px;
        position: fixed;
        top: 150px;
        right: 10px;
        background-color: orange;
        border-radius: 10px;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(3, 50px);
        grid-template-rows: repeat(3, 50px);
        gap: 5px;
    }
    #gameOverModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        justify-content: center;
        align-items: center;
    }

    #gameOverBox {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
    }

    #gameOverBox button {
        margin-top: 15px;
        background-color: green;
        color: white;
        font-size: 20px;
        padding: 10px 25px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    #milestoneModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        justify-content: center;
        align-items: center;
    }

    #milestoneBox {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
    }

    #milestoneBox button {
        margin-top: 15px;
        background-color: green;
        color: white;
        font-size: 20px;
        padding: 10px 25px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }


</style>
</head>
<body>
<h1 class="greenText">
    משחק סנייק
</h1>
<button id="newGameBtn">להתחלת משחק חדש</button>
<p id="scoreDisplay">ניקוד: 0</p>
<div id="controls"></div>
<div id="gameboard"></div>

<div id="gameOverModal">
    <div id="gameOverBox">
        <p id="gameOverMessage"></p>
        <button id="restartBtn">שחקי שוב</button>
    </div>
</div>

<div id="milestoneModal">
    <div id="milestoneBox">
        <p id="milestoneMessage"></p>
        <button id="closeMilestoneBtn">המשך משחק</button>
    </div>
</div>
<script>
    const CellValues ={
        EMPTY:0,
        FOOD:5,
        SNAKE:10,
        SNAKE_HEAD:4,
    }
    let numOfCols = 20;
    let numOfRows = 20;
    let board = [];
    let score = 0;
    for (let i = 0; i < numOfRows; i++) {

    }
    console.log(board);
    function CreatBoard(){
        for (let i = 0; i < numOfRows; i++) {
            board[i] = [];
            for (let j = 0; j < numOfCols; j++) {
                board[i].push(CellValues.EMPTY);
            }
        }
    }
    function AddFood(){
        let row, col;
        do {
            col = Math.floor(Math.random() * numOfCols);
            row = Math.floor(Math.random() * numOfRows);
        }
        while(board[row][col] !== CellValues.EMPTY)
        board[row][col] = CellValues.FOOD;
    }
    function ShowBoardWithInnerHTML(){
        let brd = document.getElementById("gameboard");
        let str = "";
        str += "<table>";
        for (let r = 0; r < numOfRows; r++) {
            str += "<tr>";
            for (let c = 0; c < numOfCols; c++) {
                if(board [r][c] === CellValues.FOOD) {
                    str += "<td class = 'food'></td>";
                }
                else {
                    str += "<td></td>";
                }
            }
            str += "</tr>";
        }
        str += "</table>";
        brd.innerHTML = str;
    }
    function ShowBoard(){
        let brd = document.getElementById("gameboard");
        let tbl = document.getElementById("table");
        for (let r = 0; r < numOfRows; r++) {
            let tr = document.createElement("tr");
            for (let c = 0; c < numOfCols; c++) {
                let td = document.createElement("td");
                if (board [r][c] === CellValues.SNAKE) {
                    td.classList.add("snake");
                }else if (board [r][c] === CellValues.FOOD) {
                    td.classList.add("food");
                }
                tr.appendChild(td);
            }
            tbl.appendChild(tr);
        }
        brd.appendChild(tbl);
    }
    function ShowBoardWithDiv() {
        let brd = document.getElementById("gameboard");
        brd.innerHTML = "";
        for (let r = 0; r < numOfRows; r++) {
            for (let c = 0; c < numOfCols; c++) {
                let el = document.createElement("div");
                switch(board[r][c]){
                    case CellValues.SNAKE:     el.classList.add("snake");    break;
                    case CellValues.SNAKE_HEAD:el.classList.add("snakeHead");break;
                    case CellValues.FOOD:      el.classList.add("food");     break;
                }
            brd.appendChild(el);
            }
        }
    }
    let snake;
    function InitSnake() {
        board [5][0] = CellValues.SNAKE;
        board [5][1] = CellValues.SNAKE;
        board [5][2] = CellValues.SNAKE_HEAD;
        snake = [
                   {r:5, c:2},
                   {r:5, c:1},
                   {r:5, c:0}
            ];
    }
    function moveLeft(){
        let head = snake[0];
        let newCol = head.c - 1;
        let newRow = head.r;
        if (newCol < 0) {
            EndGame("פגעת בקיר!");
            return;
        }
        let ateFood = (board[newRow][newCol] === CellValues.FOOD);
        snake.unshift({r: newRow, c: newCol});
        if (!ateFood) {
            let tail = snake.pop();
            board[tail.r][tail.c] = CellValues.EMPTY;
        }
        if (ateFood) {
            score = score + 10;
            document.getElementById("scoreDisplay").textContent = "ניקוד: " + score;
            if (score % 10 === 0) {
                ShowMilestoneMessage();
            }
        }
        board[newRow][newCol] = CellValues.SNAKE_HEAD;
        board[head.r][head.c] = CellValues.SNAKE;
    }
    function moveRight(){
        console.log("moveRight");
        let head =snake[0];
        let newCol = head.c+1;
        let newRow = head.r;
        if (newCol >= numOfCols) {
            EndGame("פגעת בקיר!");
            return;
        }
        let ateFood = (board[newRow][newCol] === CellValues.FOOD);
        snake.unshift({r:newRow, c:newCol});
        if (!ateFood) {
        //let tail = snake.pop();
           // board[tail.r] [tail.c] = CellValues.EMPTY;
        }
        if (ateFood) {
            score = score + 10;
            document.getElementById("scoreDisplay").textContent = "ניקוד: " + score;
            if (score % 10 === 0) {
                ShowMilestoneMessage();
            }
        }
        console.log("snake'", snake)
        board[newRow][newCol] = CellValues.SNAKE_HEAD;
        board[head.r][head.c] = CellValues.SNAKE;

    }
    function moveUp(){
        console.log("moveUp");
        let head =snake[0];
        let newRow = head.r - 1;
        let newCol = head.c;
        if (newRow < 0) {
            EndGame("פגעת בקיר!");
            return;
        }
        let ateFood = (board[newRow][newCol] === CellValues.FOOD);
        snake.unshift({r:newRow, c:newCol});
        if (!ateFood) {
        let tail = snake.pop();
            board[tail.r] [tail.c] = CellValues.EMPTY;
        }
        if (ateFood) {
            score = score + 10;
            document.getElementById("scoreDisplay").textContent = "ניקוד: " + score;
            if (score % 10 === 0) {
                ShowMilestoneMessage();
            }
        }
        console.log("snake'", snake)
        board[newRow][newCol] = CellValues.SNAKE_HEAD;
        board[head.r][head.c] = CellValues.SNAKE;

    }
    function moveDown(){
        console.log("moveDown");
        let head =snake[0];
        let newRow = head.r + 1;
        let newCol = head.c;
        if (newRow >= numOfRows) {
            EndGame("פגעת בקיר!");
            return;
        }
        let ateFood = (board[newRow][newCol] === CellValues.FOOD);
        snake.unshift({r:newRow, c:newCol});
        if (!ateFood) {
        let tail = snake.pop();
            board[tail.r] [tail.c] = CellValues.EMPTY;
        }
        if (ateFood) {
            score = score + 10;
            document.getElementById("scoreDisplay").textContent = "ניקוד: " + score;
            if (score % 10 === 0) {
                ShowMilestoneMessage();
            }
        }
        console.log("snake'", snake)
        board[newRow][newCol] = CellValues.SNAKE_HEAD;
        board[head.r][head.c] = CellValues.SNAKE;

    }
    function ShowMilestoneMessage(){
        document.getElementById("milestoneMessage").textContent = "כל הכבוד! הגעת ל-" + score + " נקודות!";
        document.getElementById("milestoneModal").style.display = "flex";
    }

    document.getElementById("closeMilestoneBtn").addEventListener("click", function(){
        document.getElementById("milestoneModal").style.display = "none";
    });

    function CreateLeftButton(){
        let btn = document.createElement("button");
        btn.textContent = "שמאלה";
        btn.style.gridRow = "2";
        btn.style.gridColumn = "1";
        btn.addEventListener("click", function () {
            moveLeft();
            ShowBoardWithDiv();
        });
        document.getElementById("controls").appendChild(btn);
    }
    function CreateRightButton() {
        let btn = document.createElement("button");
        btn.textContent = "ימינה";
        btn.style.gridRow = "2";
        btn.style.gridColumn = "3";
        btn.addEventListener("click", function () {
            moveRight();
            ShowBoardWithDiv();
        });
        document.getElementById("controls").appendChild(btn);
    }
    function CreateUpButton() {
        let btn = document.createElement("button");
        btn.textContent = "למעלה";
        btn.style.gridRow = "1";
        btn.style.gridColumn = "2";
        btn.addEventListener("click", function () {
            moveUp();
            ShowBoardWithDiv();
        });
        document.getElementById("controls").appendChild(btn);
    }
    function CreateDownButton() {
        let btn = document.createElement("button");
        btn.textContent = "למטה";
        btn.style.gridRow = "3";
        btn.style.gridColumn = "2";
        btn.addEventListener("click", function () {
            moveDown();
            ShowBoardWithDiv();
        });
        document.getElementById("controls").appendChild(btn);
    }
    function EndGame(message){
        document.getElementById("gameOverMessage").textContent = message;
        document.getElementById("gameOverModal").style.display = "flex";
    }
    function RestartGame(){
        document.getElementById("gameOverModal").style.display = "none";
        CreatBoard();
        InitSnake();
        AddFood();
        ShowBoardWithDiv();
    }

    document.getElementById("restartBtn").addEventListener("click", RestartGame);


    CreatBoard();
    InitSnake();
    AddFood();
    ShowBoardWithDiv();
    CreateLeftButton();
    CreateRightButton();
    CreateUpButton();
    CreateDownButton();
        document.getElementById("gamestartMsg").style.display = "none";
        console.log(board);


</script>
</body>
</html>
